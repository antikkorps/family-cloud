[Unit]
# Ne pas demarrer Docker (donc les conteneurs a restart:unless-stopped) avant que
# les disques de donnees soient montes. Evite qu'un conteneur recree un dossier
# vide a la place d'un point de montage absent (Immich, medias, LaCie).

# /mnt/stockage est VITAL (originaux Immich, medias Jellyfin, bind mounts).
# ext4, fiable -> dependance dure : Docker attend et echoue si absent.
RequiresMountsFor=/mnt/stockage

# LaCie (NTFS, nofail, flag dirty) n'alimente que des medias Jellyfin secondaires.
# On l'attend s'il se monte, mais on ne bloque PAS le boot de Docker s'il echoue.
After=media-franck-LaCie.mount
Wants=media-franck-LaCie.mount
